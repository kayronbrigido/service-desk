services:
  postgres:
    image: postgres:16
    container_name: ${DATABASE_NAME}
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "${DATABASE_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - app_network

  service_desk_db_iam:
    image: postgres:16
    container_name: service_desk_db_iam
    restart: always
    environment:
      POSTGRES_DB: ${IDENTITY_SERVER_DATABASE_NAME}
      POSTGRES_USER: ${IDENTITY_SERVER_DATABASE_USER}
      POSTGRES_PASSWORD: ${IDENTITY_SERVER_DATABASE_PASSWORD}
    volumes:
      - iam_pg_data:/var/lib/postgresql/data
    ports:
      - "${IDENTITY_SERVER_DATABASE_PORT}:5432"
    networks:
      - app_network

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.0
    container_name: service_desk_iam_service
    restart: always
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://service_desk_db_iam:5432/${IDENTITY_SERVER_DATABASE_NAME}
      KC_DB_USERNAME: ${IDENTITY_SERVER_DATABASE_USER}
      KC_DB_PASSWORD: ${IDENTITY_SERVER_DATABASE_PASSWORD}
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_PORT: 8080
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "8080:8080"
    volumes:
      - ./config:/opt/keycloak/data/import:ro
    command:
      - start-dev
      - --import-realm
    depends_on:
      - service_desk_db_iam
    networks:
      - app_network

volumes:
  pg_data:
  iam_pg_data:

networks:
  app_network:
    driver: bridge
